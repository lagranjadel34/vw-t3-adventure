name: APK Android (Godot)

on:
  push:
    branches: [master]
    paths: ['godot/**', '.github/workflows/godot-android.yml']
  pull_request:
    paths: ['godot/**', '.github/workflows/godot-android.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1
  APK: build/vw-t3-adventure.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Caché de Godot y plantillas
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Descargar Godot y plantillas Android
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          URL=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p ~/godot "$TPL"
          curl -sSL -o /tmp/godot.zip "$URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot && mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qj /tmp/templates.tpz templates/android_release.apk templates/android_debug.apk templates/version.txt -d "$TPL"

      - name: Configurar SDK Android para Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Exportar APK
        env:
          # Clave de pruebas (en el repo) para que cada APK se instale encima del anterior.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/godot/android/vwt3-test.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: vwt3
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: vwt3test
        working-directory: godot
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg
          ~/godot/godot --headless --import || true
          mkdir -p ../build
          ~/godot/godot --headless --export-release "Android" ../$APK
          test -f ../$APK

      - uses: actions/upload-artifact@v4
        with:
          name: vw-t3-adventure-apk
          path: ${{ env.APK }}

      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ env.APK }}
          body: |
            Versión de prueba (Godot) generada desde ${{ github.sha }}.
            Instálala en el móvil encima de la anterior.
